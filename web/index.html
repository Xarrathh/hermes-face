<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hermes</title>
<style>
  :root {
    color-scheme: dark;
    --ink: #bfeef8;
    --dim: rgba(120, 205, 220, 0.45);
    --line: rgba(80, 190, 210, 0.18);
    --panel: rgba(4, 14, 19, 0.92);
  }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: #01070a; overflow: hidden;
    font-family: "JetBrainsMono Nerd Font", "Fira Code", monospace;
    color: var(--ink);
    cursor: default;
    user-select: none;
  }
  #face { position: absolute; inset: 0; display: block; }
  /* the scanlines are a stylesheet, not a per-frame loop */
  #scan {
    position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.13) 0 1px, rgba(0,0,0,0) 1px 3px);
    mix-blend-mode: multiply;
  }

  /* hud */
  #hud { position: absolute; inset: 0; pointer-events: none; }
  #brand {
    position: absolute; top: 3.2vh; left: 3.4vw;
    font-size: clamp(10px, 0.85vw, 13px); letter-spacing: 0.55em;
    color: rgba(150, 230, 245, 0.5); text-transform: uppercase;
  }
  #brand b { font-weight: 500; color: rgba(196, 246, 255, 0.85); }
  #status {
    position: absolute; top: 3.2vh; right: 3.4vw;
    font-size: clamp(9px, 0.75vw, 12px); letter-spacing: 0.42em;
    text-transform: uppercase; color: rgba(90, 200, 215, 0.55);
    display: flex; align-items: center; gap: 0.7em;
  }
  #dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #58e0f2; box-shadow: 0 0 10px #35d2ea;
    transition: background 0.2s, box-shadow 0.2s;
  }
  body[data-state="thinking"] #dot { background: #9ad8ff; box-shadow: 0 0 12px #6cc6ff; animation: pulse 1s infinite; }
  body[data-state="speaking"] #dot { background: #b9f8ff; box-shadow: 0 0 16px #8ef0ff; }
  body[data-state="listening"] #dot { background: #57f0b0; box-shadow: 0 0 14px #35e39a; animation: pulse 0.8s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

  #caption {
    position: absolute; left: 50%; bottom: 11.5vh; transform: translateX(-50%);
    width: min(60vw, 900px); text-align: center;
    font-size: clamp(11px, 0.95vw, 15px); line-height: 1.45;
    color: rgba(186, 240, 252, 0.78); text-shadow: 0 0 18px rgba(30, 150, 175, 0.55);
    white-space: pre-wrap; min-height: 1.45em;
  }
  #heard {
    color: rgba(120, 190, 205, 0.42); font-size: 0.86em; margin-bottom: 0.5em;
  }

  #composer {
    position: absolute; left: 50%; bottom: 5.2vh; transform: translateX(-50%);
    width: min(58vw, 860px); pointer-events: auto;
    display: flex; align-items: center; gap: 0.8em;
  }
  #prompt { color: rgba(90, 200, 215, 0.55); font-size: clamp(12px, 1.05vw, 16px); }
  #line {
    flex: 1; background: transparent; border: 0; outline: 0;
    border-bottom: 1px solid rgba(80, 190, 210, 0.28);
    color: rgba(206, 248, 255, 0.95); caret-color: #7fe6f6;
    font: inherit; font-size: clamp(12px, 1.05vw, 16px);
    padding: 0.45vh 0 0.55vh; letter-spacing: 0.02em;
  }
  #line::placeholder { color: rgba(90, 170, 185, 0.28); }
  #hint {
    position: absolute; left: 3.4vw; bottom: 3.4vh;
    font-size: clamp(8px, 0.7vw, 11px); letter-spacing: 0.2em;
    color: rgba(80, 170, 185, 0.34); text-transform: uppercase;
  }
  #gear {
    position: absolute; right: 3.4vw; bottom: 3.4vh; pointer-events: auto;
    width: 34px; height: 34px; border: 1px solid rgba(80, 190, 210, 0.25);
    border-radius: 50%; background: rgba(6, 20, 26, 0.4); color: rgba(140, 230, 245, 0.7);
    font: inherit; cursor: pointer;
  }
  #gear:hover { border-color: rgba(120, 230, 250, 0.6); color: #c9f7ff; }

  /* editor */
  #panel {
    position: absolute; top: 0; right: 0; bottom: 0; width: 342px;
    background: var(--panel); border-left: 1px solid var(--line);
    backdrop-filter: blur(10px); overflow-y: auto; padding: 18px 16px 28px;
    transform: translateX(102%); transition: transform 0.22s ease;
    pointer-events: auto; box-shadow: -20px 0 60px rgba(0, 0, 0, 0.55);
  }
  #panel.open { transform: translateX(0); }
  #panel h1 {
    margin: 0 0 2px; font-size: 12px; letter-spacing: 0.4em; font-weight: 500;
    color: rgba(190, 245, 255, 0.9); text-transform: uppercase;
  }
  #panel .sub { font-size: 10px; letter-spacing: 0.18em; color: rgba(110, 190, 205, 0.5); margin-bottom: 14px; }
  #panel h2 {
    margin: 18px 0 8px; font-size: 10px; letter-spacing: 0.3em; font-weight: 500;
    color: rgba(120, 220, 238, 0.75); text-transform: uppercase;
    border-top: 1px solid rgba(80, 190, 210, 0.12); padding-top: 12px;
  }
  .row { display: grid; grid-template-columns: 1fr 46px; gap: 6px; align-items: center; margin: 7px 0; }
  /* .row's display:grid outranks the UA's [hidden] rule, so be explicit */
  .row[hidden], #paramGroups h2[hidden] { display: none; }
  .row label {
    grid-column: 1 / -1; display: flex; justify-content: space-between;
    font-size: 10.5px; letter-spacing: 0.08em; color: rgba(160, 225, 238, 0.72);
  }
  .row label output { color: rgba(120, 220, 238, 0.55); font-variant-numeric: tabular-nums; }
  .row select.pick {
    grid-column: 1 / -1; width: 100%; margin-top: 4px;
    background: rgba(10, 34, 42, 0.8); color: rgba(190, 244, 255, 0.9);
    border: 1px solid rgba(80, 190, 210, 0.28); border-radius: 3px;
    font: inherit; font-size: 10.5px; padding: 5px 6px; letter-spacing: 0.06em;
  }
  input[type="range"] { grid-column: 1 / -1; width: 100%; height: 14px; -webkit-appearance: none; background: transparent; }
  input[type="range"]::-webkit-slider-runnable-track {
    height: 2px; background: linear-gradient(90deg, rgba(80, 210, 235, 0.55), rgba(80, 210, 235, 0.12));
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 10px; height: 10px; margin-top: -4px; border-radius: 50%;
    background: #9df0ff; box-shadow: 0 0 8px rgba(110, 230, 255, 0.8); cursor: pointer;
  }
  .presets { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 4px; }
  .chip { display: inline-flex; align-items: stretch; }
  .chip button { border-radius: 999px; }
  .chip.mine > button:first-child { border-color: rgba(120, 230, 250, 0.55); color: #dffbff; }
  .chip .x {
    margin-left: -6px; padding: 0 7px; border-radius: 0 999px 999px 0;
    border-left: none; font-size: 12px; line-height: 1; opacity: 0.75;
  }
  .chip .x:hover { opacity: 1; color: #ff9db4; }
  .savepreset { display: flex; gap: 6px; margin: 2px 0 10px; }
  .savepreset input {
    flex: 1; min-width: 0; background: rgba(8, 26, 32, 0.9); color: var(--ink);
    border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px;
    font: inherit; font-size: 11px; letter-spacing: 0.04em;
  }
  .savepreset input::placeholder { color: rgba(150, 210, 225, 0.4); }
  .savepreset button { padding: 5px 10px; border-radius: 999px; }
  .savepreset input, .savepreset button {
    border: 1px solid var(--line); background: transparent; color: var(--dim);
    font-size: 11px; letter-spacing: 0.04em; cursor: pointer;
  }
  .savepreset button:hover { border-color: rgba(120, 230, 250, 0.6); color: #d8fbff; }
  .presets button, .actions button, #voice {
    background: rgba(12, 40, 50, 0.6); color: rgba(180, 240, 252, 0.82);
    border: 1px solid rgba(80, 190, 210, 0.25); border-radius: 3px;
    font: inherit; font-size: 10.5px; letter-spacing: 0.08em; padding: 5px 8px; cursor: pointer;
  }
  .presets button:hover, .actions button:hover { border-color: rgba(120, 230, 250, 0.6); color: #d8fbff; }
  .actions { display: flex; gap: 8px; margin-top: 12px; }
  #voice { width: 100%; margin-top: 6px; }
  #saveState { font-size: 9.5px; letter-spacing: 0.2em; color: rgba(110, 200, 215, 0.5); margin-top: 10px; text-transform: uppercase; }
  #panel .close {
    position: absolute; top: 14px; right: 14px; width: 26px; height: 26px;
    background: none; border: 1px solid rgba(80, 190, 210, 0.2); border-radius: 50%;
    color: rgba(160, 230, 245, 0.7); cursor: pointer; font: inherit; line-height: 1;
  }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(80, 190, 210, 0.25); border-radius: 3px; }
  body.panel-open #caption, body.panel-open #composer { opacity: 0.9; }
  #hist {
    position: absolute; right: calc(3.4vw + 44px); bottom: 3.4vh; pointer-events: auto;
    width: 34px; height: 34px; border: 1px solid rgba(80, 190, 210, 0.25);
    border-radius: 50%; background: rgba(6, 20, 26, 0.4); color: rgba(140, 230, 245, 0.7);
    font: inherit; cursor: pointer;
  }
  #hist:hover, #gear:hover { border-color: rgba(120, 230, 250, 0.6); color: #d8fbff; }

  #histPanel {
    position: absolute; top: 0; left: 0; bottom: 0; width: 360px;
    background: linear-gradient(180deg, rgba(5,18,24,0.985), rgba(3,10,14,0.995));
    border-right: 1px solid var(--line);
    backdrop-filter: blur(14px); overflow-y: auto; padding: 20px 16px 28px;
    transform: translateX(-102%); transition: transform 0.22s ease;
    pointer-events: auto; box-shadow: 20px 0 60px rgba(0, 0, 0, 0.55);
  }
  body.history-open #histPanel { transform: none; }
  #histPanel h1 { font-size: 12px; letter-spacing: 0.34em; margin: 0 0 4px; color: #cdf6ff; text-transform: uppercase; }
  #histPanel .sub { font-size: 10px; color: rgba(140, 210, 225, 0.45); margin-bottom: 14px; }
  #histPanel .sess {
    border-top: 1px solid rgba(80, 190, 210, 0.16); padding: 10px 0 6px;
  }
  #histPanel .sess .head {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 9.5px; letter-spacing: 0.16em; text-transform: uppercase;
    color: rgba(130, 220, 240, 0.6); margin-bottom: 6px;
  }
  #histPanel .turn { margin: 0 0 9px; font-size: 11px; line-height: 1.45; }
  #histPanel .turn .you { color: rgba(190, 245, 255, 0.9); }
  #histPanel .turn .bot { color: rgba(130, 200, 215, 0.7); }
  #histPanel .turn .t { color: rgba(90, 150, 165, 0.75); font-size: 9px; letter-spacing: 0.1em; }
  #histPanel button.small {
    background: transparent; border: 1px solid rgba(80, 190, 210, 0.25); border-radius: 3px;
    color: rgba(170, 235, 250, 0.75); font: inherit; font-size: 9px; letter-spacing: 0.1em;
    padding: 3px 6px; cursor: pointer; text-transform: uppercase;
  }
  #histPanel button.small:hover { border-color: rgba(120, 230, 250, 0.6); color: #e4fdff; }
  #histEmpty { font-size: 11px; color: rgba(140, 210, 225, 0.45); }
</style>
</head>
<body data-state="idle">
  <canvas id="face"></canvas>
  <div id="scan"></div>

  <div id="hud">
    <div id="brand"><b>HERMES</b> · FACE</div>
    <div id="status"><span id="dot"></span><span id="stateLabel">idle</span></div>

    <div id="caption"><div id="heard"></div><div id="said"></div></div>

    <div id="composer">
      <span id="prompt">&gt;</span>
      <input id="line" autocomplete="off" spellcheck="false" placeholder="speak or type · / for commands">
    </div>

    <div id="hint">F9 dictate · E face editor · H history · / for commands · esc close</div>
    <button id="hist" title="Recent conversations (H)">◷</button>
    <button id="gear" title="Face editor (E)">☰</button>
  </div>

  <aside id="histPanel">
    <button class="close" id="histClose" style="position:absolute;top:14px;right:14px;width:26px;height:26px;background:none;border:1px solid rgba(80,190,210,0.2);border-radius:50%;color:rgba(160,230,245,0.7);cursor:pointer;">×</button>
    <h1>History</h1>
    <div class="sub">last conversations with this face · click resume to continue one</div>
    <div id="histList"><div id="histEmpty">nothing yet</div></div>
    <div style="margin-top:14px"><button class="small" id="histClear">Clear history</button></div>
  </aside>

  <aside id="panel">
    <button class="close" id="panelClose">×</button>
    <h1>Face</h1>
    <div class="sub">everything here is saved to config.json</div>
    <div class="presets" id="presets"></div>
    <div class="savepreset">
      <input id="presetName" placeholder="name this look" maxlength="24" spellcheck="false">
      <button id="presetSave" title="Save the current look as a preset">Save current</button>
    </div>
    <div id="paramGroups"></div>
    <h2>Voice</h2>
    <select id="voice"></select>
    <div class="actions">
      <button id="voiceTest">Test voice</button>
      <button id="reset">Reset all</button>
    </div>
    <div id="saveState">saved</div>
  </aside>

  <script src="/face/face.js"></script>
  <script src="/face/ui.js"></script>
</body>
</html>
